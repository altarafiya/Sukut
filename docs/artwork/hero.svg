      <stop stop-color="#edbb68"/>
      <stop offset=".53" stop-color="#ffe3a0"/>
      <stop offset="1" stop-color="#72dcc1"/>
    </linearGradient>
    <linearGradient id="mark" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#ffedb4"/>
      <stop offset="1" stop-color="#e9ae51"/>
    </linearGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="#b1c0c4" opacity=".24"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="356" rx="28"/></clipPath>
  </defs>
