<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="356" viewBox="0 0 1200 356" role="img" aria-labelledby="title desc">
  <title id="title">Live music filtering with Sukut</title>
  <desc id="desc">Sukut processes app audio on the device, keeping speech and other sounds audible while muting music.</desc>
